pluginManagement {
    def pluginPath = "../node_modules/@react-native/gradle-plugin"
    if (!file(pluginPath).exists()) {
        pluginPath = "../../node_modules/@react-native/gradle-plugin"
    }
    includeBuild(pluginPath)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'gravatarquickeditor.example'
include ':app'
def reactNativeGradlePlugin = file("../node_modules/@react-native/gradle-plugin")
if (!reactNativeGradlePlugin.exists()) {
    reactNativeGradlePlugin = file("../../node_modules/@react-native/gradle-plugin")
}
includeBuild(reactNativeGradlePlugin)
